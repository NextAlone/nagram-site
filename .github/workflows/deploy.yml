name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Release data is fetched at build time. The hourly run rebuilds and deploys
  # only when that data differs from what production serves.
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Compare release data with production
        id: changes
        if: github.event_name == 'schedule'
        run: |
          if grep -q '"status":"error"' dist/api/releases.json; then
            echo "::warning::A release source failed to load; the current deployment stays in place."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif curl -fsS https://nagram.app/api/releases.json | cmp -s - dist/api/releases.json; then
            echo "Release data is unchanged."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'schedule' || steps.changes.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=main --commit-hash=${{ github.sha }}
